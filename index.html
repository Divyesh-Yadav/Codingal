<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ASTEROID DRIFT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #gameCanvas {
    display: block;
    background: #000;
    margin: 0 auto;
    cursor: crosshair;
  }
  #ui {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .scanlines {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,255,120,0.03) 2px,
      rgba(0,0,0,0) 3px
    );
    z-index: 10;
  }
  .vignette {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    box-shadow: inset 0 0 150px 60px rgba(0,0,0,0.8);
    z-index: 9;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    color: #0f8;
    text-shadow: 0 0 8px #0f8, 0 0 16px #0f8;
    text-align: center;
    z-index: 20;
    letter-spacing: 2px;
  }
  #overlay h1 {
    font-size: clamp(28px, 8vw, 56px);
    margin-bottom: 20px;
    animation: flicker 2.5s infinite;
  }
  #overlay p { font-size: clamp(12px, 3.5vw, 18px); margin: 6px 0; opacity: 0.9; }
  #overlay .blink { animation: blink 1s steps(1) infinite; margin-top: 24px; font-size: clamp(14px, 4vw, 20px); }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 24%, 55% { opacity: 0.4; }
  }
  #hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 14px 20px;
    color: #0f8;
    text-shadow: 0 0 6px #0f8;
    font-size: clamp(12px, 3.5vw, 18px);
    letter-spacing: 1px;
    z-index: 15;
  }
  #touchControls {
    position: fixed;
    bottom: 0; left: 0; width: 100%;
    display: none;
    justify-content: space-between;
    padding: 20px;
    z-index: 15;
    pointer-events: none;
  }
  .touchBtn {
    pointer-events: auto;
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 2px solid #0f8;
    background: rgba(0,255,120,0.1);
    color: #0f8;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    text-shadow: 0 0 6px #0f8;
  }
  .touchGroup { display: flex; gap: 12px; }
  @media (pointer: coarse) {
    #touchControls { display: flex; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<div id="ui">
  <div id="hud">
    <span id="scoreDisplay">SCORE: 0</span>
    <span id="livesDisplay">LIVES: ●●●</span>
  </div>
</div>

<div id="overlay">
  <h1>ASTEROID DRIFT</h1>
  <p>◄ ► or A/D — rotate &nbsp;|&nbsp; ▲ or W — thrust</p>
  <p>SPACE — fire</p>
  <div class="blink" id="startPrompt">PRESS SPACE TO START</div>
</div>

<div id="touchControls">
  <div class="touchGroup">
    <div class="touchBtn" id="btnLeft">◄</div>
    <div class="touchBtn" id="btnRight">►</div>
  </div>
  <div class="touchGroup">
    <div class="touchBtn" id="btnThrust">▲</div>
    <div class="touchBtn" id="btnFire">●</div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startPrompt = document.getElementById('startPrompt');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const livesDisplay = document.getElementById('livesDisplay');

  function resize() {
    const w = Math.min(window.innerWidth, 480);
    const h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- Audio (simple synthesized retro SFX) ----------
  let audioCtx;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function beep(freq, duration, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.15;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  }
  function sfxShoot() { beep(880, 0.08, 'square', 0.08); }
  function sfxExplosion() {
    if (!audioCtx) return;
    const bufferSize = audioCtx.sampleRate * 0.3;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.3;
    noise.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  }
  function sfxThrust() { beep(120, 0.06, 'sawtooth', 0.03); }
  function sfxHit() { beep(220, 0.25, 'sawtooth', 0.2); }

  // ---------- Game State ----------
  let state = 'start'; // start | playing | gameover
  let score = 0;
  let lives = 3;
  let frame = 0;

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (state === 'start' && e.code === 'Space') startGame();
    if (state === 'gameover' && e.code === 'Space') startGame();
  });
  window.addEventListener('keyup', e => keys[e.code] = false);

  // Touch controls
  function bindTouch(id, key) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; initAudio(); }, {passive:false});
    el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, {passive:false});
    el.addEventListener('mousedown', () => keys[key] = true);
    el.addEventListener('mouseup', () => keys[key] = false);
  }
  bindTouch('btnLeft', 'ArrowLeft');
  bindTouch('btnRight', 'ArrowRight');
  bindTouch('btnThrust', 'ArrowUp');
  bindTouch('btnFire', 'Space');

  canvas.addEventListener('touchstart', () => initAudio());
  canvas.addEventListener('click', () => {
    initAudio();
    if (state === 'start') startGame();
    else if (state === 'gameover') startGame();
  });

  // ---------- Starfield ----------
  let stars = [];
  function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.5 + 0.1
      });
    }
  }
  initStars();

  // ---------- Ship ----------
  let ship;
  function resetShip() {
    ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      angle: -Math.PI / 2,
      vx: 0,
      vy: 0,
      radius: 12,
      thrusting: false,
      invulnerable: 120
    };
  }

  // ---------- Bullets ----------
  let bullets = [];
  const BULLET_SPEED = 7;
  const BULLET_LIFE = 60;

  function shoot() {
    if (bullets.length > 6) return;
    bullets.push({
      x: ship.x + Math.cos(ship.angle) * ship.radius,
      y: ship.y + Math.sin(ship.angle) * ship.radius,
      vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx,
      vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy,
      life: BULLET_LIFE
    });
    sfxShoot();
  }

  // ---------- Asteroids ----------
  let asteroids = [];
  function spawnAsteroid(size, x, y) {
    const s = size || 3;
    let ax, ay;
    if (x === undefined) {
      const edge = Math.floor(Math.random() * 4);
      if (edge === 0) { ax = Math.random() * canvas.width; ay = -30; }
      else if (edge === 1) { ax = canvas.width + 30; ay = Math.random() * canvas.height; }
      else if (edge === 2) { ax = Math.random() * canvas.width; ay = canvas.height + 30; }
      else { ax = -30; ay = Math.random() * canvas.height; }
    } else { ax = x; ay = y; }

    const speedBase = 0.5 + (3 - s) * 0.4 + Math.min(score / 500, 2);
    const angle = Math.random() * Math.PI * 2;
    const points = [];
    const numPoints = 8 + Math.floor(Math.random() * 4);
    for (let i = 0; i < numPoints; i++) {
      const a = (i / numPoints) * Math.PI * 2;
      const r = (0.7 + Math.random() * 0.3);
      points.push({ a, r });
    }
    asteroids.push({
      x: ax, y: ay,
      vx: Math.cos(angle) * speedBase,
      vy: Math.sin(angle) * speedBase,
      size: s,
      radius: s * 14,
      rotation: 0,
      rotSpeed: (Math.random() - 0.5) * 0.04,
      points
    });
  }

  function initAsteroids() {
    asteroids = [];
    for (let i = 0; i < 5; i++) spawnAsteroid(3);
  }

  // ---------- Particles ----------
  let particles = [];
  function spawnExplosion(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      particles.push({
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        life: 30 + Math.random() * 20,
        color: color || '#0f8'
      });
    }
  }

  // ---------- Game Flow ----------
  function startGame() {
    score = 0;
    lives = 3;
    frame = 0;
    bullets = [];
    particles = [];
    resetShip();
    initAsteroids();
    state = 'playing';
    overlay.style.display = 'none';
    updateHUD();
  }

  function updateHUD() {
    scoreDisplay.textContent = 'SCORE: ' + score;
    livesDisplay.textContent = 'LIVES: ' + '●'.repeat(Math.max(lives, 0)) + '○'.repeat(Math.max(3 - lives, 0));
  }

  function gameOver() {
    state = 'gameover';
    overlay.querySelector('h1').textContent = 'GAME OVER';
    overlay.querySelector('p').textContent = 'SCORE: ' + score;
    overlay.querySelectorAll('p')[1].style.display = 'none';
    startPrompt.textContent = 'PRESS SPACE TO RESTART';
    overlay.style.display = 'flex';
  }

  function wrap(obj) {
    if (obj.x < -40) obj.x = canvas.width + 40;
    if (obj.x > canvas.width + 40) obj.x = -40;
    if (obj.y < -40) obj.y = canvas.height + 40;
    if (obj.y > canvas.height + 40) obj.y = -40;
  }

  function dist(x1, y1, x2, y2) {
    return Math.hypot(x1 - x2, y1 - y2);
  }

  // ---------- Update ----------
  function update() {
    frame++;

    // Stars
    for (const s of stars) {
      s.y += s.speed;
      if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
    }

    if (state !== 'playing') return;

    // Ship controls
    const rotSpeed = 0.06;
    if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= rotSpeed;
    if (keys['ArrowRight'] || keys['KeyD']) ship.angle += rotSpeed;
    ship.thrusting = !!(keys['ArrowUp'] || keys['KeyW']);

    if (ship.thrusting) {
      ship.vx += Math.cos(ship.angle) * 0.12;
      ship.vy += Math.sin(ship.angle) * 0.12;
      if (frame % 6 === 0) sfxThrust();
    }
    ship.vx *= 0.99;
    ship.vy *= 0.99;
    const maxSpeed = 6;
    const spd = Math.hypot(ship.vx, ship.vy);
    if (spd > maxSpeed) {
      ship.vx = (ship.vx / spd) * maxSpeed;
      ship.vy = (ship.vy / spd) * maxSpeed;
    }
    ship.x += ship.vx;
    ship.y += ship.vy;
    wrap(ship);
    if (ship.invulnerable > 0) ship.invulnerable--;

    // Fire
    if (keys['Space']) {
      if (!ship.cooldown || ship.cooldown <= 0) {
        shoot();
        ship.cooldown = 10;
      }
    }
    if (ship.cooldown > 0) ship.cooldown--;

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      b.life--;
      wrap(b);
      if (b.life <= 0) bullets.splice(i, 1);
    }

    // Asteroids
    for (const a of asteroids) {
      a.x += a.vx; a.y += a.vy;
      a.rotation += a.rotSpeed;
      wrap(a);
    }

    // Bullet-asteroid collisions
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (dist(a.x, a.y, b.x, b.y) < a.radius) {
          bullets.splice(j, 1);
          spawnExplosion(a.x, a.y, '#0f8');
          sfxExplosion();
          score += (4 - a.size) * 50;
          updateHUD();
          if (a.size > 1) {
            spawnAsteroid(a.size - 1, a.x, a.y);
            spawnAsteroid(a.size - 1, a.x, a.y);
          }
          asteroids.splice(i, 1);
          if (asteroids.length === 0) {
            setTimeout(() => { if (state === 'playing') initAsteroids(); }, 800);
          }
          break;
        }
      }
    }

    // Ship-asteroid collisions
    if (ship.invulnerable <= 0) {
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        if (dist(a.x, a.y, ship.x, ship.y) < a.radius + ship.radius * 0.6) {
          lives--;
          updateHUD();
          spawnExplosion(ship.x, ship.y, '#f80');
          sfxHit();
          if (lives <= 0) {
            gameOver();
          } else {
            resetShip();
          }
          break;
        }
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---------- Draw ----------
  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Stars
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      ctx.globalAlpha = 0.6;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    if (state === 'playing' || state === 'gameover') {
      // Asteroids
      ctx.strokeStyle = '#0f8';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#0f8';
      ctx.shadowBlur = 8;
      for (const a of asteroids) {
        ctx.beginPath();
        for (let i = 0; i < a.points.length; i++) {
          const p = a.points[i];
          const px = a.x + Math.cos(p.a + a.rotation) * a.radius * p.r;
          const py = a.y + Math.sin(p.a + a.rotation) * a.radius * p.r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // Bullets
      ctx.fillStyle = '#ff0';
      ctx.shadowColor = '#ff0';
      for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ship
      if (state === 'playing') {
        const blinkOff = ship.invulnerable > 0 && Math.floor(frame / 5) % 2 === 0;
        if (!blinkOff) {
          ctx.save();
          ctx.translate(ship.x, ship.y);
          ctx.rotate(ship.angle);
          ctx.strokeStyle = '#0ff';
          ctx.shadowColor = '#0ff';
          ctx.shadowBlur = 10;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(14, 0);
          ctx.lineTo(-10, -8);
          ctx.lineTo(-6, 0);
          ctx.lineTo(-10, 8);
          ctx.closePath();
          ctx.stroke();

          if (ship.thrusting) {
            ctx.strokeStyle = '#f80';
            ctx.shadowColor = '#f80';
            ctx.beginPath();
            ctx.moveTo(-6, -4);
            ctx.lineTo(-16 - Math.random() * 6, 0);
            ctx.lineTo(-6, 4);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      // Particles
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.globalAlpha = Math.max(p.life / 40, 0);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
