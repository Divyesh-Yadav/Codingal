<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Blinking Cat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fce7f3;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* CAT BODY / HEAD */
        .cat {
            position: relative;
            width: 260px;
            height: 220px;
            background: #f4a261;
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        /* EARS */
        .ear {
            position: absolute;
            top: -55px;
            width: 100px;
            height: 110px;
            background: #f4a261;
            z-index: -1;
        }

        .ear.left {
            left: 5px;
            transform: rotate(-30deg);
            border-radius: 20px 70px 10px 70px;
        }

        .ear.right {
            right: 5px;
            transform: rotate(30deg);
            border-radius: 70px 20px 70px 10px;
        }

        /* INNER EARS */
        .inner-ear {
            position: absolute;
            width: 55px;
            height: 65px;
            background: #e76f9b;
        }

        .inner-ear.left {
            top: -35px;
            left: 30px;
            transform: rotate(-30deg);
            border-radius: 15px 45px 10px 45px;
        }

        .inner-ear.right {
            top: -35px;
            right: 30px;
            transform: rotate(30deg);
            border-radius: 45px 15px 45px 10px;
        }

        /* EYES */
        .eye {
            position: absolute;
            top: 75px;
            width: 42px;
            height: 42px;
            background: #222;
            border-radius: 50%;
            z-index: 5;

            /* BLINK */
            animation: blink 4s infinite;
        }

        .eye.left {
            left: 55px;
        }

        .eye.right {
            right: 55px;
        }

        /* EYE HIGHLIGHTS */
        .eye::after {
            content: "";
            position: absolute;
            top: 7px;
            left: 9px;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
        }

        /* NOSE */
        .nose {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 19px;
            background: #e76f9b;
            border-radius: 50% 50% 60% 60%;
            z-index: 6;
        }

        /* MOUTH */
        .mouth {
            position: absolute;
            top: 146px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 30px;
            z-index: 5;
        }

        .mouth::before,
        .mouth::after {
            content: "";
            position: absolute;
            top: 0;
            width: 27px;
            height: 20px;
            border-bottom: 4px solid #222;
        }

        .mouth::before {
            left: 0;
            border-radius: 0 0 0 25px;
        }

        .mouth::after {
            right: 0;
            border-radius: 0 0 25px 0;
        }

        /* WHISKERS */
        .whisker {
            position: absolute;
            width: 75px;
            height: 2px;
            background: #333;
            z-index: 5;
        }

        .whisker.left1 {
            left: -55px;
            top: 125px;
            transform: rotate(10deg);
        }

        .whisker.left2 {
            left: -55px;
            top: 145px;
        }

        .whisker.left3 {
            left: -55px;
            top: 165px;
            transform: rotate(-10deg);
        }

        .whisker.right1 {
            right: -55px;
            top: 125px;
            transform: rotate(-10deg);
        }

        .whisker.right2 {
            right: -55px;
            top: 145px;
        }

        .whisker.right3 {
            right: -55px;
            top: 165px;
            transform: rotate(10deg);
        }

        /* BLINKING ANIMATION */
        @keyframes blink {
            0% {
                height: 42px;
                transform: translateY(0);
            }

            45% {
                height: 42px;
                transform: translateY(0);
            }

            47% {
                height: 5px;
                transform: translateY(18px);
            }

            49% {
                height: 42px;
                transform: translateY(0);
            }

            85% {
                height: 42px;
                transform: translateY(0);
            }

            87% {
                height: 5px;
                transform: translateY(18px);
            }

            89% {
                height: 42px;
                transform: translateY(0);
            }

            100% {
                height: 42px;
                transform: translateY(0);
            }
        }

        /* TAIL */
        .tail {
            position: absolute;
            width: 120px;
            height: 70px;
            border: 20px solid #f4a261;
            border-left: none;
            border-radius: 0 70px 70px 0;
            right: -85px;
            bottom: 5px;
            transform: rotate(-15deg);
            z-index: -2;
        }

        /* PAWS */
        .paw {
            position: absolute;
            bottom: -25px;
            width: 75px;
            height: 50px;
            background: #f4a261;
            border-radius: 50%;
        }

        .paw.left {
            left: 45px;
        }

        .paw.right {
            right: 45px;
        }

        /* TEXT */
        .title {
            position: absolute;
            top: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="title">Pure CSS Cat 🐱</div>

    <div class="cat">

        <!-- EARS -->
        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="inner-ear left"></div>
        <div class="inner-ear right"></div>

        <!-- EYES -->
        <div class="eye left"></div>
        <div class="eye right"></div>

        <!-- NOSE -->
        <div class="nose"></div>

        <!-- MOUTH -->
        <div class="mouth"></div>

        <!-- WHISKERS -->
        <div class="whisker left1"></div>
        <div class="whisker left2"></div>
        <div class="whisker left3"></div>

        <div class="whisker right1"></div>
        <div class="whisker right2"></div>
        <div class="whisker right3"></div>

        <!-- PAWS -->
        <div class="paw left"></div>
        <div class="paw right"></div>

        <!-- TAIL -->
        <div class="tail"></div>

    </div>

</body>
</html>
